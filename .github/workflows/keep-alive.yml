# Держим бэкенд Nova на Render живым: бесплатный тариф засыпает после ~15 мин
# без трафика, а этот пинг бьёт в /health каждые 5 минут — сервис не спит.
name: Keep backend alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping https://nova-mesenger.onrender.com/health
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 \
              https://nova-mesenger.onrender.com/health || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "backend did not respond"
          exit 1
